spring:
  application:
    name: pos-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/pos_saas}
    username: ${DB_USER:pos}
    password: ${DB_PASSWORD:pos}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

logging:
  level:
    com.possaas: INFO
    org.flywaydb: INFO

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:4200}
  dian:
    mode: ${DIAN_MODE:SIMULATED}
    endpoint: ${DIAN_ENDPOINT:}
    api-key: ${DIAN_API_KEY:}
