<div class="min-h-screen bg-slate-100">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-3 px-4 py-3">
      <a routerLink="/pos" class="flex items-center gap-2 font-bold text-slate-800">
        <span class="rounded-lg bg-emerald-600 px-2 py-1 text-white">POS</span>
        <span class="hidden sm:inline">La Esquina · Offline-First</span>
      </a>

      <nav class="flex flex-wrap items-center gap-1 text-sm">
        <a routerLink="/pos" routerLinkActive="bg-slate-900 text-white"
           class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-200">Punto de venta</a>
        <a routerLink="/caja" routerLinkActive="bg-slate-900 text-white"
           class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-200">Caja</a>
        <a routerLink="/historial" routerLinkActive="bg-slate-900 text-white"
           class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-200">Historial</a>
        <a routerLink="/inventario" routerLinkActive="bg-slate-900 text-white"
           class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-200">Inventario</a>
        <a routerLink="/cargue-masivo" routerLinkActive="bg-slate-900 text-white"
           class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-200">Cargue Masivo</a>
        <a routerLink="/reportes" routerLinkActive="bg-slate-900 text-white"
           class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-200">Reportes</a>
        <a routerLink="/seguridad" routerLinkActive="bg-slate-900 text-white"
           class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-200">Seguridad</a>
      </nav>

      <div class="ml-auto flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full"
              [class.bg-emerald-500]="sync.online()"
              [class.bg-rose-500]="!sync.online()"></span>
        <span class="text-sm font-medium" [class.text-emerald-700]="sync.online()"
              [class.text-rose-700]="!sync.online()">
          {{ sync.online() ? 'Online' : 'Offline' }}
        </span>

        <span class="rounded-full bg-amber-100 px-2.5 py-1 text-xs font-semibold text-amber-800">
          {{ sync.pendingCount() }} pendiente(s)
        </span>

        <button type="button" (click)="sync.synchronize()"
                [disabled]="sync.syncing()"
                class="rounded-md bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700 disabled:opacity-50">
          {{ sync.syncing() ? 'Sincronizando…' : 'Sincronizar ahora' }}
        </button>
      </div>
    </div>

    <div class="border-t border-slate-100 bg-slate-50 px-4 py-1.5 text-center text-xs text-slate-500">
      {{ sync.message() }}
      @if (sync.persistent()) { <span>· Almacenamiento persistente activo</span> }
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6">
    <router-outlet />
  </main>
</div>
